name: Build sheng test kernel

on:
  workflow_dispatch:
  push:
    branches:
      - codex/sheng-7.2.6-ifpc-off-iris

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch patch baseline
        run: git fetch --no-tags --depth=1 origin 42f3b40c702abbc37c3a04c95af008cd283aeaf3
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential flex bison libssl-dev libelf-dev bc kmod cpio zstd python3 git
      - name: Build kernel and package
        shell: bash
        run: bash scripts/build-sheng.sh 2>&1 | tee build-sheng.log
      - name: Upload kernel bundle
        uses: actions/upload-artifact@v4
        with:
          name: sheng-7.2.6-ifpc-off-iris-${{ github.sha }}
          path: out/artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheng-build-log-${{ github.sha }}
          path: |
            out/.config
            build-sheng.log
          include-hidden-files: true
          retention-days: 14
